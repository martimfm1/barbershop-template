name: One-time Prettier format fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm exec prettier --write .

      - name: Commit formatting changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git rm .github/workflows/format-fix.yml

          if git diff --cached --quiet; then
            echo "No formatting changes found."
            exit 0
          fi

          git commit -m "chore(format): apply Prettier formatting"
          git push
