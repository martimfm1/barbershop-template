name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality + Production Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Static security audit
        run: pnpm qa:security

      - name: Build
        run: pnpm build

      - name: Start production server
        run: pnpm start > /tmp/silentra-next.log 2>&1 &

      - name: Wait for production server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/silentra-next.log
          exit 1

      - name: Smoke QA
        env:
          QA_BASE_URL: http://127.0.0.1:3000
        run: pnpm qa:smoke

      - name: Plan contracts
        run: pnpm qa:plans
