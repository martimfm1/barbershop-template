name: One-time product polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch onboarding and navigation
        shell: python
        run: |
          from pathlib import Path

          onboarding = Path("app/onboarding/page.tsx")
          text = onboarding.read_text(encoding="utf-8")

          old_helper_anchor = "function getErrorMessage(error: unknown): string {\n  if (error instanceof Error) return error.message;\n  if (typeof error === 'string') return error;\n  return 'Ocorreu um erro inesperado.';\n}\n"
          new_helper_anchor = old_helper_anchor + "\nfunction normalizeInviteCode(value: string): string {\n  const cleaned = value.toUpperCase().replace(/[^A-Z0-9]/g, '');\n  if (cleaned.startsWith('BARB')) {\n    const body = cleaned.slice(4, 12);\n    return body.length ? `BARB-${body.slice(0, 4)}${body.length > 4 ? `-${body.slice(4)}` : ''}` : 'BARB-';\n  }\n  if (/^[A-Z0-9]{1,8}$/.test(cleaned)) {\n    return cleaned.length > 4 ? `BARB-${cleaned.slice(0, 4)}-${cleaned.slice(4, 8)}` : cleaned;\n  }\n  return cleaned.slice(0, 14);\n}\n"
          if old_helper_anchor not in text:
            raise SystemExit("onboarding helper anchor not found")
          text = text.replace(old_helper_anchor, new_helper_anchor, 1)

          old_body = "body: JSON.stringify({ inviteCode: inviteCode.trim().toUpperCase() }),"
          new_body = "body: JSON.stringify({ inviteCode: normalizeInviteCode(inviteCode) }),"
          if old_body not in text:
            raise SystemExit("onboarding join body not found")
          text = text.replace(old_body, new_body, 1)

          old_input = """onChange={(event) =>\n                          setInviteCode(event.target.value.toUpperCase())\n                        }\n                        placeholder=\"BB-98X2\"\n                        maxLength={10}\n                        autoComplete=\"one-time-code\""""
          new_input = """onChange={(event) =>\n                          setInviteCode(normalizeInviteCode(event.target.value))\n                        }\n                        placeholder=\"BARB-7K4P-9X2M\"\n                        maxLength={14}\n                        inputMode=\"text\"\n                        autoComplete=\"one-time-code\""""
          if old_input not in text:
            raise SystemExit("onboarding invite input block not found")
          text = text.replace(old_input, new_input, 1)

          onboarding.write_text(text, encoding="utf-8")

          sidebar = Path("app/dashboard/_components/DashboardSidebar.tsx")
          sidebar_text = sidebar.read_text(encoding="utf-8")
          replacements = {
            "{ href: '/dashboard', label: 'Resumo', icon: LayoutDashboard },": "{ href: '/dashboard', label: 'Início', icon: LayoutDashboard },",
            "{ href: '/dashboard/agenda', label: 'Marcações', icon: CalendarDays },": "{ href: '/dashboard/agenda', label: 'Agenda', icon: CalendarDays },",
            "label: 'Barbeiros',": "label: 'Equipa',",
          }
          for old, new in replacements.items():
            if old not in sidebar_text:
              raise SystemExit(f"sidebar replacement not found: {old}")
            sidebar_text = sidebar_text.replace(old, new, 1)
          sidebar.write_text(sidebar_text, encoding="utf-8")

      - name: Commit changes and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/onboarding/page.tsx app/dashboard/_components/DashboardSidebar.tsx
          git commit -m "feat: polish onboarding invite and navigation labels"
          git rm .github/workflows/one-time-product-polish.yml
          git commit -m "chore: remove one-time polish workflow"
          git push
