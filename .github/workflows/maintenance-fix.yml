name: Maintenance fix

on:
  push:
    paths:
      - '.github/workflows/maintenance-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply focused UX fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/barbershops/components/booking-drawer-canonical.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  const [error, setError] = useState('');\n",
                  "  const [error, setError] = useState('');\n  const [retryKey, setRetryKey] = useState(0);\n",
              ),
              (
                  "    setError('');\n    setName('');\n",
                  "    setError('');\n    setRetryKey(0);\n    setName('');\n",
              ),
              (
                  "  }, [currentDay.dateStr, isOpen, shop]);\n",
                  "  }, [currentDay.dateStr, isOpen, retryKey, shop]);\n",
              ),
              (
                  "  }, [currentDay.dateStr, isOpen, professional, service, shop, step]);\n",
                  "  }, [currentDay.dateStr, isOpen, professional, retryKey, service, shop, step]);\n",
              ),
              (
                  "                onClick={() => setError('')}\n              >\n                Tentar novamente\n",
                  "                onClick={() => {\n                  setError('');\n                  if (step < 3) setRetryKey((value) => value + 1);\n                }}\n              >\n                {step < 3 ? 'Tentar novamente' : 'Voltar aos dados'}\n",
              ),
              (
                  "      <DrawerContent className=\"mx-auto flex h-[100dvh] max-h-[100dvh] w-full max-w-lg flex-col overflow-hidden rounded-none border-white/10 bg-zinc-950 text-zinc-100 sm:h-auto sm:max-h-[92dvh] sm:rounded-t-3xl\">\n",
                  "      <DrawerContent className=\"mx-auto flex h-[82dvh] max-h-[82dvh] w-full max-w-lg flex-col overflow-hidden rounded-t-3xl border-white/10 bg-zinc-950 text-zinc-100 sm:h-auto sm:max-h-[92dvh] sm:rounded-t-3xl\">\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify TypeScript-sensitive edits
        run: |
          grep -n "retryKey\|Voltar aos dados\|h-\[82dvh\]" app/barbershops/components/booking-drawer-canonical.tsx

      - name: Commit changes and remove maintenance workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/barbershops/components/booking-drawer-canonical.tsx .github/workflows/maintenance-fix.yml
          git commit -m "fix(booking): make retry actionable and improve mobile drawer" || exit 0
          git rm .github/workflows/maintenance-fix.yml
          git commit -m "chore: remove temporary maintenance workflow"
          git push
